<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>PaFlemme</title>
</head>
<body>
    <header>
        <div id="logo">logo</div>
        <h1> PaFlemme</h1>
        <div id="nouveauT">nouvelle tache</div>
    </header>
    <main>
    <!-- ZONE GAUCHE -->
        <section id="gauche">
        <!-- Zone en Haut à gauche -->
            <section id="HAUTGAUCHE">
            <!-- Zone 1 (Haut)-->
                <section class ="Section1">
                <!-- Image -->
                    <img id= "enfant" src="https://cdn-icons-png.flaticon.com/512/7084/7084446.png" alt="Image illustrative">
                <br>
                <!-- Menu -->
                    <label for="age-select">Choisissez votre profil&nbsp;:</label>
                    <select name="age" id="age-select">
                        <option value="">--Veuillez choisir vôtre tranche d'âge--</option>
                        <option value="enfant">6-10 ans</option>
                        <option value="ado">11-15 ans</option>
                    </select>
                </section>
            <!-- Zone 2 (Bas) -->
                <section class="Section2">
                <!-- Image -->
                    <img id="adult" src="https://cdn-icons-png.flaticon.com/512/3107/3107137.png" alt="Image illustrative">
                <br>
                <!-- Menu  -->
                    <label for="age-select">Choisissez votre profil&nbsp;:</label>
                    <select name="age" id="age-select">
                        <option value="">--Veuillez choisir votre tranche d'âge--</option>
                        <option value="jeune">16-25 ans</option>
                        <option value="adulte">26-60 ans</option>
                        <option value="senior">60 ans et +</option>
                    </select>
                </section>
            </section>
        <hr class="separateur">
        <!-- Zone en Haut à gauche -->
            <section id="BASGAUCHE">
                <div class="zone-texte-rectangle-1">
                        Texte 📋​
                </div>
            </section> 
        </section>

    <!-- ZONE CENTRE -->
        <section id="centre">
                <p class="zone-texte-rectangle-2">
                    Tache 1 ✏️​
                </p>
                <p class="zone-texte-rectangle-2">
                        Tache 2 ✏️​
                </p>
                <p class="zone-texte-rectangle-2">
                        Tache 3 ✏️​
                </p>
                <p class="zone-texte-rectangle-2">
                        Tache 4 ✏️​
                </p>
        </section>
    <!-- ZONE DROITE -->
        <section id="droit">DROITE

        </section>

    <!-- BOUTON EN BAS A DROITE -->
        <button class="boutton-plus" aria-label="Ajouter">+</button>
    </main>
    <footer>
        <p>&copy; DI 25-27</p>
    </footer>
</body>
</html>
